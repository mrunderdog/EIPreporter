name: EIPreporter Weekly Report

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EIP_OFFICIAL_REPO_PATH: .sources/EIPs
      ERC_OFFICIAL_REPO_PATH: .sources/ERCs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout official EIPs source
        uses: actions/checkout@v4
        with:
          repository: ethereum/EIPs
          path: .sources/EIPs
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout official ERCs source
        uses: actions/checkout@v4
        with:
          repository: ethereum/ERCs
          path: .sources/ERCs
          fetch-depth: 0
          persist-credentials: false

      - name: Verify official source history
        shell: bash
        run: |
          set -euo pipefail

          for repo in .sources/EIPs .sources/ERCs; do
            echo "Repository: $repo"
            git -C "$repo" rev-parse --is-inside-work-tree
            shallow="$(git -C "$repo" rev-parse --is-shallow-repository)"
            echo "isShallow=$shallow"
            git -C "$repo" rev-list --count HEAD
            git -C "$repo" log --reverse -1 --format=%cI
            git -C "$repo" log -1 --format=%cI
            if [ "$shallow" != "false" ]; then
              echo "::error::$repo is shallow; full history is required for deterministic local backfill"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore persistent report state
        id: restore-report-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/eipreporter.sqlite
            data/historical-git-cache.json
            data/adoption-evidence-cache.json
          key: eipreporter-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            eipreporter-data-${{ runner.os }}-

      - name: Run shared weekly CI pipeline
        run: npm run weekly:ci

      - name: Save persistent report state
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/eipreporter.sqlite
            data/historical-git-cache.json
            data/adoption-evidence-cache.json
          key: eipreporter-data-${{ runner.os }}-${{ github.run_id }}

      - name: Determine report date
        id: report-date
        shell: bash
        run: |
          set -euo pipefail

          latest_quality="$(ls -1 reports/weekly-*.quality.json | sort | tail -n 1)"

          report_date="$(
            basename "$latest_quality" |
            sed -E 's/^weekly-([0-9]{4}-[0-9]{2}-[0-9]{2})\.quality\.json$/\1/'
          )"

          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"
          echo "Detected report date: $report_date"

      - name: Upload weekly report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eipreporter-weekly-${{ github.run_id }}
          path: |
            reports/weekly-*.html
            reports/weekly-*.compact.json
            reports/weekly-*.quality.json
            reports/input/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate weekly report quality
        run: npm run quality:strict -- reports/weekly-${{ steps.report-date.outputs.report_date }}.quality.json

      - name: Send weekly report to Telegram
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: npm run send:weekly:existing -- --report-path reports/weekly-${{ steps.report-date.outputs.report_date }}.html

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages site
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail

          report_path="reports/weekly-${{ steps.report-date.outputs.report_date }}.html"

          test -s "$report_path"
          rm -rf _site
          mkdir -p _site
          cp "$report_path" _site/index.html
          touch _site/.nojekyll
          test -s "_site/index.html"

          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const htmlPath = path.join("_site", "index.html");
          const html = fs.readFileSync(htmlPath, "utf8");
          const linkPattern = /\b(?:href|src)=["']([^"']+)["']/gi;
          const missing = [];
          const forbiddenLinks = [];
          const relativeAssets = new Set();

          for (const match of html.matchAll(linkPattern)) {
            const raw = match[1].trim();
            if (
              !raw ||
              raw.startsWith("#") ||
              /^(?:mailto:|tel:|data:|javascript:)/i.test(raw)
            ) {
              continue;
            }

            if (/^(?:file:\/\/|https?:\/\/(?:localhost|127\.0\.0\.1)(?::|\/|$))/i.test(raw)) {
              forbiddenLinks.push(raw);
            }

            if (raw.startsWith("/") || /^https?:/i.test(raw)) {
              continue;
            }

            const assetPath = raw.split(/[?#]/, 1)[0];
            if (!assetPath) continue;
            relativeAssets.add(assetPath);
          }

          for (const asset of relativeAssets) {
            const sourcePath = path.normalize(path.join("reports", asset));
            const sitePath = path.normalize(path.join("_site", asset));

            if (!sourcePath.startsWith(`reports${path.sep}`) || !sitePath.startsWith(`_site${path.sep}`)) {
              missing.push(`${asset}: invalid relative path`);
              continue;
            }

            if (!fs.existsSync(sourcePath)) {
              missing.push(asset);
              continue;
            }

            fs.mkdirSync(path.dirname(sitePath), { recursive: true });
            fs.copyFileSync(sourcePath, sitePath);
          }

          if (missing.length > 0) {
            console.error(`Missing relative assets: ${missing.join(", ")}`);
            process.exit(1);
          }

          if (forbiddenLinks.length > 0) {
            console.error(`Report contains forbidden local links: ${forbiddenLinks.join(", ")}`);
            process.exit(1);
          }

          console.log(`Prepared _site with ${relativeAssets.size} relative asset(s).`);
          NODE

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: weekly-report
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
