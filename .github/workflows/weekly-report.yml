name: EIPreporter Weekly Report

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EIP_OFFICIAL_REPO_PATH: .sources/EIPs
      ERC_OFFICIAL_REPO_PATH: .sources/ERCs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout official EIPs source
        uses: actions/checkout@v4
        with:
          repository: ethereum/EIPs
          path: .sources/EIPs
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout official ERCs source
        uses: actions/checkout@v4
        with:
          repository: ethereum/ERCs
          path: .sources/ERCs
          fetch-depth: 0
          persist-credentials: false

      - name: Verify official source history
        shell: bash
        run: |
          set -euo pipefail

          for repo in .sources/EIPs .sources/ERCs; do
            echo "Repository: $repo"
            git -C "$repo" rev-parse --is-inside-work-tree
            shallow="$(git -C "$repo" rev-parse --is-shallow-repository)"
            echo "isShallow=$shallow"
            git -C "$repo" rev-list --count HEAD
            git -C "$repo" log --reverse -1 --format=%cI
            git -C "$repo" log -1 --format=%cI
            if [ "$shallow" != "false" ]; then
              echo "::error::$repo is shallow; full history is required for deterministic local backfill"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore persistent report state
        id: restore-report-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/eipreporter.sqlite
            data/historical-git-cache.json
            data/adoption-evidence-cache.json
          key: eipreporter-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            eipreporter-data-${{ runner.os }}-

      - name: Run CI source doctor
        run: npm run ci:doctor

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Collect EIP and ERC proposals
        run: |
          npm run collect -- --trend-days 180 --change-days 7 --snapshot-out reports/input/weekly-current.snapshot.json --diagnostics-out reports/input/weekly-current.collection.json

      - name: Run collection preflight
        run: npm run ci:preflight -- --snapshot reports/input/weekly-current.snapshot.json

      - name: Save persistent report state
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/eipreporter.sqlite
            data/historical-git-cache.json
            data/adoption-evidence-cache.json
          key: eipreporter-data-${{ runner.os }}-${{ github.run_id }}

      - name: Generate weekly HTML report
        run: npm run report:html -- --snapshot reports/input/weekly-current.snapshot.json

      - name: Determine report date
        id: report-date
        shell: bash
        run: |
          set -euo pipefail

          latest_quality="$(ls -1 reports/weekly-*.quality.json | sort | tail -n 1)"

          report_date="$(
            basename "$latest_quality" |
            sed -E 's/^weekly-([0-9]{4}-[0-9]{2}-[0-9]{2})\.quality\.json$/\1/'
          )"

          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"
          echo "Detected report date: $report_date"

      - name: Upload weekly report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eipreporter-weekly-${{ github.run_id }}
          path: |
            reports/weekly-*.html
            reports/weekly-*.compact.json
            reports/weekly-*.quality.json
            reports/input/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate weekly report quality
        shell: bash
        run: |
          set -euo pipefail

          quality_path="reports/weekly-${{ steps.report-date.outputs.report_date }}.quality.json"

          node -e '
            const fs = require("fs");

            const qualityPath = process.argv[1];
            const quality = JSON.parse(
              fs.readFileSync(qualityPath, "utf8")
            );

            const failed = (quality.checks || []).filter(
              (check) =>
                check.severity === "fail" &&
                check.passed === false
            );

            if (quality.passed !== true || failed.length > 0) {
              console.error(
                `Quality gate failed for ${qualityPath}`
              );

              for (const check of failed) {
                console.error("");
                console.error(`[${check.id}]`);
                console.error(
                  `observed: ${JSON.stringify(check.observed ?? "")}`
                );
                console.error(
                  `expected: ${JSON.stringify(check.expected ?? "")}`
                );
                console.error(
                  `failureReason: ${check.failureReason ?? ""}`
                );
                console.error(
                  `affectedIds: ${JSON.stringify(check.affectedIds ?? [])}`
                );
              }

              process.exit(1);
            }

            console.log(`Quality gate passed for ${qualityPath}`);
          ' "$quality_path"

      - name: Send weekly report to Telegram
        run: npm run send:weekly:existing -- --report-path reports/weekly-${{ steps.report-date.outputs.report_date }}.html
