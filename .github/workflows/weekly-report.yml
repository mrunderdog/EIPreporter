name: EIPreporter Weekly Report

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Collect EIP and ERC proposals
        run: npm run collect

      - name: Generate weekly HTML report
        run: npm run report:html -- --trend-days 180 --change-days 7

      - name: Determine report date
        id: report-date
        shell: bash
        run: |
          set -euo pipefail
          latest_quality="$(ls -1 reports/weekly-*.quality.json | sort | tail -n 1)"
          report_date="$(basename "$latest_quality" | sed -E 's/^weekly-([0-9]{4}-[0-9]{2}-[0-9]{2})\.quality\.json$/\1/')"
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Validate weekly report quality
        shell: bash
        run: |
          set -euo pipefail
          quality_path="reports/weekly-${{ steps.report-date.outputs.report_date }}.quality.json"
          node -e '
            const fs = require("fs");
            const qualityPath = process.argv[1];
            const quality = JSON.parse(fs.readFileSync(qualityPath, "utf8"));
            const failed = (quality.checks || []).filter((check) => check.severity === "fail" && check.passed === false);
            if (quality.passed !== true || failed.length > 0) {
              console.error(`Quality gate failed for ${qualityPath}`);
              console.error(failed.map((check) => check.id).join("\n"));
              process.exit(1);
            }
          ' "$quality_path"

      - name: Send weekly report to Telegram
        run: npm run send:weekly -- --trend-days 180 --change-days 7

      - name: Upload weekly report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eipreporter-weekly-${{ steps.report-date.outputs.report_date }}
          path: |
            reports/weekly-${{ steps.report-date.outputs.report_date }}.html
            reports/weekly-${{ steps.report-date.outputs.report_date }}.compact.json
            reports/weekly-${{ steps.report-date.outputs.report_date }}.quality.json
          if-no-files-found: error
          retention-days: 30
